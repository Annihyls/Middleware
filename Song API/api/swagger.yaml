basePath: /
definitions:
  models.Song:
    properties:
      artist:
        type: string
      id:
        type: string
      title:
        type: string
    type: object
info:
  contact:
    email: justine.bachelard@ext.uca.fr
    name: Justine Bachelard.
  description: API to manage collections.
  title: middleware/example
  version: 1.0.0
paths:
  /collections/{id}:
    get:
      description: Get a song.
      parameters:
      - description: Song UUID formatted ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Song'
        "422":
          description: Cannot parse id
        "500":
          description: Something went wrong
      summary: Get a song.
      tags:
      - Songs
  /collections/songs/{id}:
    delete:
      description: Delete an existing song from the collection.
      parameters:
      - description: Song ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "404":
          description: Song not found
        "500":
          description: Something went wrong
      summary: Delete an existing song from the collection.
      tags:
      - songs
schemes:
- http
swagger: "2.0"
